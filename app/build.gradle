buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
    }
}
apply plugin: 'com.android.application'

repositories {
    mavenCentral()
    google()
}

def signingFile = file 'signing.gradle'
if (signingFile.exists()) apply from: signingFile

allprojects {
    tasks.withType(JavaCompile) {
        // TODO include deprecations at some point, but currently they are *many*
        options.compilerArgs << "-Xlint:all" << "-Xlint:-deprecation" << "-Xlint:-dep-ann"
    }
}

android {
    namespace = 'se.lublin.mumla'
    compileSdk = 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    base {
        archivesName = "mumla-funk"
    }

    // gradle8: Need to enable this when defaultConfig below contains some custom BuildConfig
    buildFeatures {
        buildConfig = true
    }

    // Mumla Funk has its own version line (based on Mumla 3.7.3).
    def funkVersion = "1.0.7"

    defaultConfig {
        minSdkVersion 21
        targetSdk 36

        // Own application ID so that Mumla Funk can be installed next to the regular Mumla app.
        applicationId "de.filubu.funk"
        // code: XYYZZbb (bb for build)
        versionCode 1000700
        versionName funkVersion

        buildConfigField "long", "TIMESTAMP", System.currentTimeMillis() + "L"
        buildConfigField "String", "VERSIONTAG", "\"" + funkVersion + "\""
        // Authority of the channel search provider, derived from the application ID so the app
        // installs next to Mumla (see AndroidManifest.xml and res/xml/searchable.xml).
        resValue "string", "search_authority", applicationId + ".channel.ChannelSearchProvider"

        testInstrumentationRunner "android.test.InstrumentationTestRunner"
    }

    // Mumla Funk has a single build variant (no product flavors): the same app goes to GitHub
    // (APK, ./gradlew assembleRelease) and to Google Play (app bundle, ./gradlew bundleRelease).
    // No donation links, no billing library.
    buildTypes {
        release {
            if (android.hasProperty("signingConfigs")) {
                if (signingConfigs.hasProperty("release")) {
                    signingConfig = signingConfigs.release
                }
            }
        }
        debug {
            versionNameSuffix "-debug"
        }
    }
    lint {
        abortOnError = true
        // InvalidPackage is spongycastle-related
        disable 'InvalidPackage', 'MissingTranslation'
        explainIssues = true
        ignoreWarnings = false
        quiet = false
    }

}

dependencies {
    implementation project(":libraries:humla")
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    // Springs for the walkie-talkie popup (already pulled in by the Material library).
    implementation 'androidx.dynamicanimation:dynamicanimation:1.1.0'
    implementation 'androidx.fragment:fragment:1.8.9'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'org.jsoup:jsoup:1.13.1'
    implementation 'info.guardianproject.netcipher:netcipher:2.1.0'

}
